name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: soft/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
